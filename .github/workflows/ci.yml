# Vérifications à chaque push et pull request : types, tests TS, tests et lint Rust.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Dépendances système (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

      - name: Modules de contenu — vérification et construction
        run: |
          npm run module:check
          npm run module:build
      - uses: actions/upload-artifact@v7
        with:
          name: abbon-modules
          path: dist/modules/*.qcm
          if-no-files-found: error

      - name: Rust — format, lint, tests
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  a11y:
    # Audit d'accessibilité (axe-core, WCAG 2.1 A/AA) de tous les écrans, thèmes clair et sombre,
    # dans WebKitGTK (le moteur de l'application sous Linux).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: WebKitGTK pour Python
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-webkit2-4.1 xvfb
      - run: npm ci
      - run: npm run build
      - name: Audit
        run: |
          npx vite preview --port 4173 --strictPort &
          for _ in $(seq 60); do curl -sf http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
          WEBKIT_DISABLE_COMPOSITING_MODE=1 xvfb-run -a /usr/bin/python3 scripts/a11y/audit.py --base http://127.0.0.1:4173 --json a11y.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: a11y-report
          path: a11y.json
          if-no-files-found: ignore
