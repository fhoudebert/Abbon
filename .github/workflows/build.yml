# Paquets d'Abbon, dans l'ordre de priorité : Linux, Android, Windows, macOS.
# Linux et Windows en x86-64 et en ARM64 : Tauri ne compile pas pour un autre processeur, l'ARM64 est
# construit sur des runners ARM natifs (ubuntu-22.04-arm, windows-11-arm), gratuits pour les dépôts publics.
# Modèle : le workflow de publication de tabulon, même pile Tauri 2. macOS : une application universelle.
#
# Déclenchement :
# - À la demande (onglet Actions → Build → Run workflow) : branche, tag ou commit en paramètre,
#   choix des plateformes. Les paquets sont disponibles dans les « artifacts » de l'exécution.
# - Sur un tag vX.Y.Z : les quatre plateformes, puis un brouillon de release GitHub avec
#   tous les fichiers et leurs empreintes SHA-256. Le tag doit correspondre à la version de package.json.
#   Les questionnaires (.qcm) n'en font pas partie : l'application se construit sans eux, et ils sont publiés
#   à part sur GitHub Pages (voir docs/modules.md, « Publication »).
#
# Configuration (Settings › Secrets and variables › Actions), tout est facultatif :
#   Variables : ABBON_SITE_URL        adresse du site (https://…), serveur de mises à jour par défaut ;
#                                     sans elle, les applications se mettent à jour depuis les releases GitHub
#               TAURI_UPDATER_PUBKEY  clé publique de signature des mises à jour (fichier .pub)
#   Secrets   : TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD   signature des mises à jour
#               ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   Variable  : ANDROID_CERT_SHA256 (facultative)  empreinte attendue du certificat de l'APK
#               FTP_URL (ftp://, ftps:// ou sftp://hôte), FTP_USER, FTP_PASSWORD, FTP_DIR   dépôt du site
# Voir docs/distribution.md.
name: Build

run-name: Build ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branche, tag ou commit à compiler'
        required: true
        default: main
        type: string
      linux:
        description: 'Linux : deb, rpm, AppImage'
        type: boolean
        default: true
      android:
        description: 'Android : APK'
        type: boolean
        default: true
      windows:
        description: 'Windows : MSI, NSIS'
        type: boolean
        default: true
      arm64:
        description: 'Linux et Windows aussi en ARM64 (runners ARM natifs)'
        type: boolean
        default: true
      macos:
        description: 'macOS : application universelle (.dmg)'
        type: boolean
        default: true
      smoke:
        description: 'Tests d’installation (Debian, Ubuntu, Fedora, Windows, macOS, émulateur Android)'
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  # Référence compilée : celle choisie à la main, sinon le tag poussé.
  BUILD_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
      linux: ${{ steps.m.outputs.linux }}
      windows: ${{ steps.m.outputs.windows }}
      smoke_linux: ${{ steps.m.outputs.smoke_linux }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}
      - id: v
        name: Version et commit
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHA=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "### Abbon $VERSION — $BUILD_REF ($SHA)" >> "$GITHUB_STEP_SUMMARY"
      # Matrices des jobs Linux, Windows et des tests d'installation : x86-64, plus ARM64 sauf si
      # décoché au lancement manuel (toujours pour un tag). Le nom (x64, arm64) suit les artefacts.
      - id: m
        name: Architectures
        env:
          ARM64: ${{ github.event_name == 'push' || inputs.arm64 }}
        run: |
          linux='[{"arch":"x64","os":"ubuntu-22.04"}'
          windows='[{"arch":"x64","os":"windows-latest","bundles":"msi,nsis"}'
          smoke='[{"arch":"x64","runner":"ubuntu-24.04","image":"debian:12","kind":"deb"},{"arch":"x64","runner":"ubuntu-24.04","image":"debian:13","kind":"deb"},{"arch":"x64","runner":"ubuntu-24.04","image":"ubuntu:24.04","kind":"deb"},{"arch":"x64","runner":"ubuntu-24.04","image":"fedora:latest","kind":"rpm"},{"arch":"x64","runner":"ubuntu-24.04","image":"ubuntu:24.04","kind":"appimage"}'
          if [ "$ARM64" = true ]; then
            # Même Ubuntu 22.04 qu'en x86-64 (glibc ancienne). Pas de MSI en ARM64 : WiX ne le produit pas.
            linux+=',{"arch":"arm64","os":"ubuntu-22.04-arm"}'
            windows+=',{"arch":"arm64","os":"windows-11-arm","bundles":"nsis"}'
            smoke+=',{"arch":"arm64","runner":"ubuntu-24.04-arm","image":"debian:12","kind":"deb"},{"arch":"arm64","runner":"ubuntu-24.04-arm","image":"fedora:latest","kind":"rpm"},{"arch":"arm64","runner":"ubuntu-24.04-arm","image":"ubuntu:24.04","kind":"appimage"}'
          fi
          { echo "linux=$linux]"; echo "windows=$windows]"; echo "smoke_linux=$smoke]"; } >> "$GITHUB_OUTPUT"
          echo "Architectures : x86-64$([ "$ARM64" = true ] && echo ', ARM64')" >> "$GITHUB_STEP_SUMMARY"
      - name: Le tag correspond à la version de package.json
        if: github.event_name == 'push'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version v$VERSION de package.json"
            exit 1
          fi

  linux:
    needs: prepare
    if: github.event_name == 'push' || inputs.linux
    # Ubuntu 22.04 : glibc plus ancienne, donc AppImage compatible avec plus de distributions.
    # ARM64 (Raspberry Pi 4/5 en 64 bits, portables et serveurs ARM) : ubuntu-22.04-arm, même raison.
    name: linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.linux) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: npm }
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev rpm zsync
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Paquets Linux (signés pour les mises à jour si la clé est configurée)
        env:
          ABBON_UPDATE_URL: ${{ vars.ABBON_SITE_URL || format('https://github.com/{0}', github.repository) }}
          ABBON_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy (outil de l'AppImage) est lui-même une AppImage : sans FUSE, extraite puis lancée.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        shell: bash
        run: |
          # Information de mise à jour inscrite dans l'AppImage (AppImageUpdate, gestionnaires d'AppImage,
          # demandée par AppImageHub) : fichier .zsync de la dernière release GitHub publiée. Lue par le
          # greffon AppImage de linuxdeploy, qu'utilise Tauri. L'application garde sa propre mise à jour.
          case "${{ matrix.arch }}" in x64) a=x86_64 ;; arm64) a=aarch64 ;; esac
          export LDAI_UPDATE_INFORMATION="gh-releases-zsync|${GITHUB_REPOSITORY%%/*}|${GITHUB_REPOSITORY#*/}|latest|Abbon-*-$a.AppImage.zsync"
          export UPDATE_INFORMATION="$LDAI_UPDATE_INFORMATION"
          echo "Information de mise à jour : $LDAI_UPDATE_INFORMATION"
          EXTRA=()
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            [ -n "$ABBON_UPDATER_PUBKEY" ] || { echo "::error::variable TAURI_UPDATER_PUBKEY manquante"; exit 1; }
            # La clé publique doit aussi figurer dans la configuration : le bundler la vérifie en signant.
            EXTRA=(--config "$(node -p 'JSON.stringify({bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:process.env.ABBON_UPDATER_PUBKEY}}})')")
          fi
          npx tauri build --bundles deb,rpm,appimage "${EXTRA[@]}"
      - name: "Nom de l'AppImage selon AppImageHub : Abbon-<version>-x86_64.AppImage, Abbon-<version>-aarch64.AppImage"
        working-directory: src-tauri/target/release/bundle/appimage
        run: |
          # Un éventuel .zsync de linuxdeploy porte l'ancien nom : refait ci-dessous.
          rm -fv ./*.zsync
          for f in Abbon_*_amd64.AppImage* Abbon_*_aarch64.AppImage*; do
            [ -e "$f" ] || continue
            n=$(echo "$f" | sed -E 's/^Abbon_(.+)_amd64\.AppImage/Abbon-\1-x86_64.AppImage/; s/^Abbon_(.+)_aarch64\.AppImage/Abbon-\1-aarch64.AppImage/')
            mv -v "$f" "$n"
          done
      - name: Information de mise à jour de l'AppImage et fichier .zsync
        working-directory: src-tauri/target/release/bundle/appimage
        shell: bash
        run: |
          f=$(ls Abbon-*.AppImage)
          # Section .upd_info de l'exécutable de l'AppImage (spécification AppImage, type 2).
          info=$(objcopy -O binary --only-section=.upd_info "$f" /dev/stdout | tr -d '\0')
          echo "Information de mise à jour : $info"
          [[ "$info" == gh-releases-zsync\|* ]] || { echo "::error::information de mise à jour absente de $f"; exit 1; }
          # Delta de téléchargement pour AppImageUpdate : URL relative, le .zsync est publié à côté de l'AppImage.
          zsyncmake -u "$f" -o "$f.zsync" "$f"
          head -n 8 "$f.zsync"
      - name: Paquets produits (processeur attendu)
        shell: bash
        run: |
          cd src-tauri/target/release/bundle
          ls -l deb rpm appimage
          case "${{ matrix.arch }}" in
            x64) want='_amd64.deb|x86_64.rpm|-x86_64.AppImage' ;;
            arm64) want='_arm64.deb|aarch64.rpm|-aarch64.AppImage' ;;
          esac
          for p in ${want//|/ }; do
            compgen -G "*/*$p" > /dev/null || { echo "::error::aucun paquet *$p"; exit 1; }
          done
          # Processeur de l'exécutable (mainBinaryName : Abbon).
          file ../Abbon
      - uses: actions/upload-artifact@v7
        with:
          name: abbon-linux-${{ matrix.arch }}-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.sha }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb*
            src-tauri/target/release/bundle/rpm/*.rpm*
            src-tauri/target/release/bundle/appimage/*.AppImage*

  android:
    needs: prepare
    if: github.event_name == 'push' || inputs.android
    runs-on: ubuntu-24.04
    # Les secrets ANDROID_* sont des secrets d'ENVIRONNEMENT (Settings → Environments → android-release) :
    # sans cette ligne, le job ne les voit pas (valeurs vides) et produit un APK de debug.
    environment: android-release
    env:
      NDK_VERSION: 27.2.12479018
      VERSION: ${{ needs.prepare.outputs.version }}
      # Serveur de mises à jour par défaut, intégré à la compilation.
      ABBON_UPDATE_URL: ${{ vars.ABBON_SITE_URL || format('https://github.com/{0}', github.repository) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: npm }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      # Comme le workflow Android de mogichex (opérationnel) : setup-android v4, paquets explicites.
      # En v3, la valeur par défaut « tools platform-tools » réclamait le paquet « tools », retiré
      # du dépôt de Google (« Failed to find package 'tools' »).
      # build-tools sert à zipalign / apksigner ; le NDK compile la partie Rust.
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;36.0.0 ndk;${{ env.NDK_VERSION }}"
          log-accepted-android-sdk-licenses: false
      - name: NDK_HOME
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Projet Android
        run: npx tauri android init --ci
      # Comme dans le workflow Android de mogichex : le secret est lu dans une étape (et non dans
      # l'environnement du job), puis le résultat est transmis aux étapes suivantes.
      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
            echo "Clé trouvée dans l'environnement android-release : APK de release signé."
          elif [ "${{ github.ref_type }}" = tag ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 absent de l'environnement android-release : une release doit être signée."
            exit 1
          else
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 absent de l'environnement android-release : APK de debug."
          fi

      - name: APK de release signé
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ABBON_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ABBON_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ABBON_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Facultatif : empreinte attendue du certificat, le build échoue si la clé n'est pas la bonne.
          ABBON_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          npx tauri android build --apk --ci
          export ABBON_KEYSTORE_FILE="$RUNNER_TEMP/abbon.keystore"
          trap 'rm -f "$ABBON_KEYSTORE_FILE"' EXIT
          # « base64 -i » ignore les retours à la ligne et espaces éventuels du secret collé.
          printf '%s' "$KEYSTORE" | base64 -d -i > "$ABBON_KEYSTORE_FILE"
          # Même script que sur le poste (où il lit keystore.properties) : alignement, signature, vérification.
          bash scripts/android/sign-apk.sh "" "$PWD/abbon-${VERSION}.apk"

      - name: APK de debug (pas de clé configurée)
        if: env.HAS_KEYSTORE != 'true'
        run: |
          npx tauri android build --apk --debug --ci
          cp "$(find src-tauri/gen/android/app/build/outputs/apk -name '*debug.apk' | head -1)" "abbon-${VERSION}-debug.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: abbon-android-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.sha }}
          path: abbon-*.apk

  windows:
    needs: prepare
    if: github.event_name == 'push' || inputs.windows
    # ARM64 (Snapdragon X, Surface Pro…) : windows-11-arm, installateur NSIS seulement.
    name: windows (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.windows) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Installateurs Windows (signés pour les mises à jour si la clé est configurée)
        env:
          ABBON_UPDATE_URL: ${{ vars.ABBON_SITE_URL || format('https://github.com/{0}', github.repository) }}
          ABBON_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          EXTRA=()
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            [ -n "$ABBON_UPDATER_PUBKEY" ] || { echo "::error::variable TAURI_UPDATER_PUBKEY manquante"; exit 1; }
            # La clé publique doit aussi figurer dans la configuration : le bundler la vérifie en signant.
            EXTRA=(--config "$(node -p 'JSON.stringify({bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:process.env.ABBON_UPDATER_PUBKEY}}})')")
          fi
          npx tauri build --bundles ${{ matrix.bundles }} "${EXTRA[@]}"
      - name: Paquets produits (processeur attendu)
        shell: bash
        run: |
          ls -l src-tauri/target/release/bundle/*/
          compgen -G "src-tauri/target/release/bundle/nsis/*_${{ matrix.arch }}-setup.exe" > /dev/null \
            || { echo "::error::aucun installateur *_${{ matrix.arch }}-setup.exe"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: abbon-windows-${{ matrix.arch }}-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.sha }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi*
            src-tauri/target/release/bundle/nsis/*.exe*

  macos:
    # Une seule application pour Apple silicon et Intel (binaire universel), en .dmg.
    # Signature ad hoc (« - ») : sans elle, macOS refuse le binaire Apple silicon ; sans compte
    # développeur Apple, on ne peut pas faire mieux (pas de notarisation, voir docs/distribution.md).
    # Modèle : le workflow de publication de tabulon, même pile Tauri 2.
    needs: prepare
    if: github.event_name == 'push' || inputs.macos
    runs-on: macos-latest
    env:
      BUNDLE: src-tauri/target/universal-apple-darwin/release/bundle
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Application macOS universelle (mises à jour signées si la clé est configurée)
        env:
          ABBON_UPDATE_URL: ${{ vars.ABBON_SITE_URL || format('https://github.com/{0}', github.repository) }}
          ABBON_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            [ -n "$ABBON_UPDATER_PUBKEY" ] || { echo "::error::variable TAURI_UPDATER_PUBKEY manquante"; exit 1; }
          fi
          # Une seule configuration fusionnée : signature ad hoc, et artefacts de mise à jour si la clé existe.
          CONFIG=$(node -p '
            const c = { bundle: { macOS: { signingIdentity: "-" } } };
            if (process.env.TAURI_SIGNING_PRIVATE_KEY) {
              c.bundle.createUpdaterArtifacts = true;
              c.plugins = { updater: { pubkey: process.env.ABBON_UPDATER_PUBKEY } };
            }
            JSON.stringify(c)')
          npx tauri build --target universal-apple-darwin --bundles app,dmg --config "$CONFIG"
      - name: Vérification et noms publiés
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -e
          apps=("$BUNDLE"/macos/*.app)
          app="${apps[0]}"
          codesign --verify --deep --verbose=2 "$app"
          archs="$(lipo -archs "$app/Contents/MacOS/Abbon")"
          echo "Architectures : $archs"
          case "$archs" in *x86_64*arm64*|*arm64*x86_64*) ;; *) echo "::error::binaire non universel ($archs)"; exit 1 ;; esac
          mkdir -p out
          cp "$BUNDLE"/dmg/*.dmg out/
          # Archive de mise à jour (seulement si la clé de signature est configurée).
          for f in "$BUNDLE"/macos/*.app.tar.gz "$BUNDLE"/macos/*.app.tar.gz.sig; do
            [ -e "$f" ] || continue
            cp "$f" "out/Abbon_${VERSION}_universal${f##*/Abbon}"
          done
          ls -l out
      - uses: actions/upload-artifact@v7
        with:
          name: abbon-macos-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.sha }}
          path: out/*
          if-no-files-found: error

  # ---- Tests d'installation ----------------------------------------------------
  # Installent les paquets produits ci-dessus et lancent l'application : elle doit tourner
  # 30 s et créer sa base. Informatifs : la release ne les attend pas.

  smoke-linux:
    needs: [prepare, linux]
    if: github.event_name == 'push' || inputs.smoke
    # x86-64 et ARM64 (runner ubuntu-24.04-arm : les images debian, ubuntu et fedora existent pour les deux).
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.smoke_linux) }}
    container: ${{ matrix.image }}
    # Nom fixe : GitHub y ajoute lui-même les valeurs de la matrice (« smoke-linux (x64, …, debian:12, deb) »).
    # Avec un nom construit sur matrix.*, un job ignoré s'affichait tel quel : « smoke ${{ matrix.image }} … ».
    name: smoke-linux
    steps:
      # Pas de git dans les images de base : récupération du dépôt par l'API (archive).
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}
      - uses: actions/download-artifact@v8
        with:
          name: abbon-linux-${{ matrix.arch }}-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.sha }}
          path: dist
      - name: Installation (${{ matrix.kind }})
        run: |
          set -e
          f=$(find dist -name "*.${{ matrix.kind == 'appimage' && 'AppImage' || matrix.kind }}" | head -1)
          echo "Paquet : $f"
          case "${{ matrix.kind }}" in
            deb) apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y "./$f" xvfb xauth ;;
            rpm) dnf install -y "./$f" xorg-x11-server-Xvfb xorg-x11-xauth which ;;
            appimage)
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb xauth libwebkit2gtk-4.1-0 libgtk-3-0
              chmod +x "$f" && cp "$f" /usr/local/bin/abbon-appimage ;;
          esac
      - name: Lancement
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          if [ "${{ matrix.kind }}" = appimage ]; then cmd=/usr/local/bin/abbon-appimage; else cmd=Abbon; fi
          bash scripts/smoke/linux.sh "$cmd"

  smoke-windows:
    needs: [prepare, windows]
    if: github.event_name == 'push' || inputs.smoke
    name: smoke-windows
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.windows) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}
          sparse-checkout: scripts/smoke
      - uses: actions/download-artifact@v8
        with:
          name: abbon-windows-${{ matrix.arch }}-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.sha }}
          path: dist
      - name: Installation et lancement
        shell: pwsh
        run: ./scripts/smoke/windows.ps1 -Dist dist

  smoke-android:
    needs: [prepare, android]
    if: github.event_name == 'push' || inputs.smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}
          sparse-checkout: scripts/smoke
      - uses: actions/download-artifact@v8
        with:
          name: abbon-android-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.sha }}
          path: dist
      - name: Accélération matérielle (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Émulateur Android 14, installation et lancement
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/smoke/android.sh "$(ls dist/*.apk | head -1)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: abbon-android-capture
          path: android-smoke.png
          if-no-files-found: ignore

  smoke-macos:
    needs: [prepare, macos]
    if: github.event_name == 'push' || inputs.smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}
          sparse-checkout: scripts/smoke
      - uses: actions/download-artifact@v8
        with:
          name: abbon-macos-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.sha }}
          path: dist
      - name: Installation depuis le .dmg et lancement
        run: bash scripts/smoke/macos.sh dist/*.dmg

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, linux, android, windows, macos]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: npm }
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - name: Paquets à plat dans dist/ (Linux et Windows arrivent dans des sous-dossiers)
        # upload-artifact garde l'arborescence sous le dossier commun le plus profond : les artefacts Linux
        # contiennent deb/, rpm/ et appimage/, ceux de Windows msi/ et nsis/. Or « files: dist/* » et
        # build-site.ts ne prennent que les fichiers placés directement dans dist/.
        run: |
          find dist -mindepth 2 -type f -exec mv -n -t dist {} +
          find dist -mindepth 1 -type d -empty -delete
          ls -l dist
          missing=0
          # x86-64 et ARM64 pour Linux et Windows (pas de MSI en ARM64), application universelle pour macOS.
          for pattern in '*_amd64.deb' '*.x86_64.rpm' '*-x86_64.AppImage' '*-x86_64.AppImage.zsync' '*_x64*.msi' '*_x64-setup.exe' \
                         '*_arm64.deb' '*.aarch64.rpm' '*-aarch64.AppImage' '*-aarch64.AppImage.zsync' '*_arm64-setup.exe' '*.dmg' '*.apk'; do
            if ! compgen -G "dist/$pattern" > /dev/null; then echo "::error::aucun paquet $pattern dans dist/"; missing=1; fi
          done
          exit $missing
      - name: Site de téléchargement (page, version.json, latest.json, SHA256SUMS) et manifestes de la release
        env:
          SITE_URL: ${{ vars.ABBON_SITE_URL }}
        run: |
          node scripts/release/build-site.ts \
            --dist dist --out site --version "$VERSION" --base-url "$SITE_URL" \
            --github-release "https://github.com/${{ github.repository }}/releases/download/v$VERSION" --github-out gh
          cp site/releases/SHA256SUMS.txt gh/*.json dist/
      - name: Portail d'hébergement de QCM (Abbon-portail-X.Y.Z.zip, hors version.json)
        # Lecteur du site (vite build --mode site) et correcteur PHP de cette version : release GitHub, site de
        # téléchargement (releases/, lien sur la page) et empreinte ajoutée aux deux SHA256SUMS.txt.
        run: |
          npm ci
          npm run portail
          zip="Abbon-portail-$VERSION.zip"
          test -f "dist/portail/$zip" || { echo "::error::dist/portail/$zip absent (version de package.json ?)"; exit 1; }
          mv "dist/portail/$zip" dist/ && rmdir dist/portail
          cp "dist/$zip" site/releases/
          (cd dist && sha256sum "$zip") | tee -a dist/SHA256SUMS.txt >> site/releases/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: abbon-site-${{ needs.prepare.outputs.version }}
          path: site
          include-hidden-files: true # .htaccess
      - uses: softprops/action-gh-release@v3
        with:
          name: Abbon ${{ needs.prepare.outputs.version }}
          draft: true
          files: dist/*

  deploy:
    # Dépôt du site sur l'hébergement (facultatif : seulement si FTP_URL est configuré).
    needs: [prepare, release]
    runs-on: ubuntu-24.04
    env:
      HAS_FTP: ${{ secrets.FTP_URL != '' }}
    steps:
      - uses: actions/download-artifact@v8
        if: env.HAS_FTP == 'true'
        with:
          name: abbon-site-${{ needs.prepare.outputs.version }}
          path: site
      - name: Dépôt (paquets d'abord, manifestes en dernier)
        if: env.HAS_FTP == 'true'
        env:
          FTP_URL: ${{ secrets.FTP_URL }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          sudo apt-get install -y lftp
          DIR="${FTP_DIR:-.}"
          # Les clients ne voient la nouvelle version qu'une fois tous ses fichiers en ligne.
          lftp -u "$FTP_USER,$FTP_PASSWORD" "$FTP_URL" -e "
            set ssl:verify-certificate yes; set ftp:ssl-allow yes; set net:max-retries 3;
            mirror -R --verbose --exclude-glob *.json site/ $DIR;
            mirror -R --verbose --include-glob *.json site/releases/ $DIR/releases;
            bye"
