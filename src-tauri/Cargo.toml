[package]
name = "abbon"
version = "0.4.3"
description = "Abbon — application de QCM multiplateforme"
authors = ["Contributeurs Abbon"]
license = "MIT"
rust-version = "1.90"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "abbon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Ouvre le navigateur (page de téléchargement, nouvel APK).
tauri-plugin-opener = "2"
# Lecture de releases/version.json (petit client HTTP, TLS rustls).
ureq = { version = "2", default-features = false, features = ["tls"] }
# Même sqlx que le plugin SQL : transactions dans la commande run_batch.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"


# Mises à jour automatiques : ordinateur uniquement.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
