# Module « Transformer et conserver » — point 13 de la feuille de route de novembre 2026
# (dossier de travail nucleaire/, retiré après usage : voir l'historique git).
# Niveau loisir, objectif culinaire. Rédigé à partir de notes de l'auteur (prompt.txt : fermenté ou
# pas, bactéries et moisissures, pratique de la lactofermentation), complétées et vérifiées en novembre 2026
# (décret n° 88-1203 sur le yaourt, cahier des charges du comté, Agroscope pour les trous de l'emmental).
