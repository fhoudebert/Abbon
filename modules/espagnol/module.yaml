level: A2-B2
license: CC-BY-NC-SA-4.0
authors: [Abbon]
homepage: https://github.com/fhoudebert/Abbon
languages: [fr]
requires:
  app: ">=0.2.0"
defaults:
  passThreshold: 0.7

categories:
  - id: vocabulaire
    name: { fr: "Faux amis et vocabulaire" }
  - id: grammaire
    name: { fr: "Grammaire et conjugaison" }
  - id: expressions
    name: { fr: "Expressions idiomatiques" }
