# Module « Maths spécialité, terminale » — programme 2019 (bac 2027), puis 2026 (bac 2028).
# Chaque QCM porte l'étiquette du programme (prog-2019 ; prog-2026 quand il sera repris).
# Questions reprises des ébauches (modules/_ebauches/math/01-bases.md), reformulées et vérifiées.

id: org.abbon.maths-specialite
